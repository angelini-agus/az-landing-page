<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1440 528"
  preserveAspectRatio="xMidYMid slice"
  aria-hidden="true"
>
  <defs>
    <!-- Base: dark violet (not near-black) — stays in purple territory all the way down -->
    <linearGradient id="az-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2B2640" />
      <stop offset="100%" stop-color="#2B2640" />
    </linearGradient>

    <!-- Wide arc — very elliptical, spans full width, sits above the canvas.
         Low blur so the lila-tone banding is visible. -->
    <radialGradient id="az-arc"
      cx="50%" cy="0%" r="80%"
      gradientTransform="matrix(1.55 0 0 0.75 -0.275 0)">
      <stop offset="0%"   stop-color="#FFFFFF"  stop-opacity="0.90" />
      <stop offset="8%"   stop-color="#E9E2F7"  stop-opacity="0.88" />
      <stop offset="20%"  stop-color="#C4B8E8"  stop-opacity="0.82" />
      <stop offset="36%"  stop-color="#8B7BC7"  stop-opacity="0.72" />
      <stop offset="54%"  stop-color="#5B4E8A"  stop-opacity="0.55" />
      <stop offset="74%"  stop-color="#3D3568"  stop-opacity="0.30" />
      <stop offset="100%" stop-color="#2B2640"  stop-opacity="0.00" />
    </radialGradient>

    <!-- Second arc layer — slightly wider spread, adds lila-medio depth in the mid zone -->
    <radialGradient id="az-arc2"
      cx="50%" cy="0%" r="70%"
      gradientTransform="matrix(1.8 0 0 0.55 -0.4 0)">
      <stop offset="0%"   stop-color="#C4B8E8"  stop-opacity="0.50" />
      <stop offset="25%"  stop-color="#8B7BC7"  stop-opacity="0.42" />
      <stop offset="55%"  stop-color="#5B4E8A"  stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2B2640"  stop-opacity="0.00" />
    </radialGradient>

    <!-- Left dark corner vignette -->
    <radialGradient id="az-vl" cx="0%" cy="25%" r="50%">
      <stop offset="0%"   stop-color="#1E1935" stop-opacity="0.70" />
      <stop offset="100%" stop-color="#1E1935" stop-opacity="0.00" />
    </radialGradient>

    <!-- Right dark corner vignette -->
    <radialGradient id="az-vr" cx="100%" cy="25%" r="50%">
      <stop offset="0%"   stop-color="#1E1935" stop-opacity="0.70" />
      <stop offset="100%" stop-color="#1E1935" stop-opacity="0.00" />
    </radialGradient>

    <!-- Bottom fade — ends at violeta-osc, not indigo -->
    <linearGradient id="az-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="50%"  stop-color="#2B2640" stop-opacity="0.00" />
      <stop offset="100%" stop-color="#241F3A" stop-opacity="0.60" />
    </linearGradient>

    <!-- Soft blur for the first arc layer (reduced vs before, keeps bands visible) -->
    <filter id="az-blur-sm" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <!-- Medium blur for second arc (ambient spread) -->
    <filter id="az-blur-md" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <!-- Layer 1: flat violet base -->
  <rect width="1440" height="528" fill="url(#az-base)" />

  <!-- Layer 2: wide ambient arc (blurred for soft spread) -->
  <rect width="1440" height="528" fill="url(#az-arc2)" filter="url(#az-blur-md)" />

  <!-- Layer 3: primary arc with visible lila bands (light blur only) -->
  <rect width="1440" height="528" fill="url(#az-arc)" filter="url(#az-blur-sm)" />

  <!-- Layer 4: left corner darkening -->
  <rect width="1440" height="528" fill="url(#az-vl)" />

  <!-- Layer 5: right corner darkening -->
  <rect width="1440" height="528" fill="url(#az-vr)" />

  <!-- Layer 6: bottom darkening (stays in violet, not indigo) -->
  <rect width="1440" height="528" fill="url(#az-bottom)" />
</svg>
